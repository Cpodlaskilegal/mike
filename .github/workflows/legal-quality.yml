name: Legal output quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  legal-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm exec --prefix backend -- tsx --test backend/test/legalOutputGate.test.ts backend/test/legalOutputRuntime.test.ts
      - run: npm run legal:quality-gate --prefix backend -- --report ../artifacts/legal-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-quality-measurement
          path: artifacts/legal-quality.json
